plugins { id 'com.android.application' }

// Store builds never update themselves: Google Play does that, and the menu opens the listing instead. The release
// type is the store build; debug and preview are the ones distributed from the website, which look for updates
// there. -PplayStore=true or -PplayStore=false overrides this for one build.
def playStoreOverride = providers.gradleProperty('playStore').getOrNull()
if (playStoreOverride != null && !(playStoreOverride in ['true', 'false'])) throw new GradleException('playStore must be true or false.')

// Google ads (AdMob): the banner at the foot of the screen and the full-page ad after every fifth story. The ids are the ones of the
// owner's AdMob account. They are not secret (every APK holds them) but a build must not make them up, so they come from Gradle
// properties (android/gradle.properties, or -P on the command line): admobAppId, admobBannerUnit and admobNativeUnit. The preview and
// release builds show an ad only where its unit is set, and none at all while they are not. The debug build shows none either, unless
// -PtestAds=true, which uses Google's demo ad units: real test ads, safe to click, tied to no account, for looking at the layout.
// A build for readers must never carry the demo ids, and a live ad must never be clicked while testing (that is invalid traffic).
def adProperty = { String name -> (providers.gradleProperty(name).getOrNull() ?: '').trim() }
def adIf = { String value, String pattern -> value ==~ pattern ? value : '' }
def demoAdApp = 'ca-app-pub-3940256099942544~3347511713'
def demoAdBanner = 'ca-app-pub-3940256099942544/9214589741'
def demoAdNative = 'ca-app-pub-3940256099942544/2247696110'
def liveAdApp = adIf(adProperty('admobAppId'), /ca-app-pub-\d{16}~\d{10}/)
def liveAdBanner = liveAdApp.isEmpty() ? '' : adIf(adProperty('admobBannerUnit'), /ca-app-pub-\d{16}\/\d{10}/)
def liveAdNative = liveAdApp.isEmpty() ? '' : adIf(adProperty('admobNativeUnit'), /ca-app-pub-\d{16}\/\d{10}/)
def showTestAds = providers.gradleProperty('testAds').getOrNull() == 'true'
// -PadsConsentTest=eea (or other) makes a debug build behave as if the reader were in the EEA (or outside it), to see Google's consent
// message. It never reaches a build for readers.
def adsConsentTest = adProperty('adsConsentTest')
if (!(adsConsentTest in ['', 'eea', 'other'])) throw new GradleException('adsConsentTest must be eea or other.')
if (providers.gradleProperty('admobAppId').isPresent() && liveAdApp.isEmpty()) throw new GradleException('admobAppId is not an AdMob app id (ca-app-pub-0000000000000000~0000000000).')
if (!liveAdApp.isEmpty()) {
    if (providers.gradleProperty('admobBannerUnit').isPresent() && liveAdBanner.isEmpty()) throw new GradleException('admobBannerUnit is not an AdMob ad unit id (ca-app-pub-0000000000000000/0000000000).')
    if (providers.gradleProperty('admobNativeUnit').isPresent() && liveAdNative.isEmpty()) throw new GradleException('admobNativeUnit is not an AdMob ad unit id (ca-app-pub-0000000000000000/0000000000).')
}

// The key that signs the bundle for Google Play (the upload key) is kept outside the repository, in a properties file
// on the machine that builds: PLAX_UPLOAD_PROPERTIES names it, otherwise ~/.plax-signing/upload.properties. Run
// new-upload-key.ps1 once to make both. Without the file the release type stays unsigned, so a build can never be
// signed with a key by accident, and package-aab.ps1 refuses to hand over an unsigned bundle.
def uploadPropertiesFile = file(providers.environmentVariable('PLAX_UPLOAD_PROPERTIES')
        .orElse("${System.getProperty('user.home')}/.plax-signing/upload.properties").get())
def uploadProperties = new Properties()
if (uploadPropertiesFile.isFile()) uploadPropertiesFile.withInputStream { uploadProperties.load(it) }

android {
    namespace 'com.plaxlabs.news'
    compileSdk 36
    defaultConfig {
        applicationId 'com.plaxlabs.news'
        minSdk 26
        targetSdk 36
        versionCode 13
        versionName '1.5.5'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // The browser returns to the app on this scheme after Google sign-in; each build type has its own. The AdMob app id is
        // required in the manifest by the ads library; with no ad shown it is the demo id, which is tied to no account and asks for nothing.
        manifestPlaceholders = [authScheme: 'com.plaxlabs.news', admobAppId: demoAdApp]
        buildConfigField 'String', 'AUTH_SCHEME', '"com.plaxlabs.news"'
        buildConfigField 'String', 'ADS_BANNER_UNIT', '""'
        buildConfigField 'String', 'ADS_PAGE_UNIT', '""'
        buildConfigField 'String', 'ADS_CONSENT_TEST', '""'
    }
    buildFeatures {
        buildConfig true
    }
    androidResources {
        localeFilters += ['en', 'hi']
    }
    signingConfigs {
        if (uploadProperties.getProperty('storeFile')) {
            upload {
                storeFile file(uploadProperties.getProperty('storeFile'))
                storePassword uploadProperties.getProperty('storePassword')
                keyAlias uploadProperties.getProperty('keyAlias')
                keyPassword uploadProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            manifestPlaceholders = [authScheme: 'com.plaxlabs.news.preview', admobAppId: demoAdApp]
            buildConfigField 'String', 'AUTH_SCHEME', '"com.plaxlabs.news.preview"'
            buildConfigField 'boolean', 'PLAY_STORE', playStoreOverride ?: 'false'
            buildConfigField 'String', 'ADS_BANNER_UNIT', showTestAds ? '"' + demoAdBanner + '"' : '""'
            buildConfigField 'String', 'ADS_PAGE_UNIT', showTestAds ? '"' + demoAdNative + '"' : '""'
            buildConfigField 'String', 'ADS_CONSENT_TEST', '"' + adsConsentTest + '"'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [authScheme: 'com.plaxlabs.news', admobAppId: liveAdApp.isEmpty() ? demoAdApp : liveAdApp]
            buildConfigField 'boolean', 'PLAY_STORE', playStoreOverride ?: 'true'
            buildConfigField 'String', 'ADS_BANNER_UNIT', '"' + liveAdBanner + '"'
            buildConfigField 'String', 'ADS_PAGE_UNIT', '"' + liveAdNative + '"'
            if (signingConfigs.findByName('upload')) signingConfig signingConfigs.upload
        }
        // The shipped preview: optimized like release (R8, not debuggable) but signed with the local
        // debug key, so it installs over earlier previews. It is not a store release.
        preview {
            initWith release
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            manifestPlaceholders = [authScheme: 'com.plaxlabs.news.preview', admobAppId: liveAdApp.isEmpty() ? demoAdApp : liveAdApp]
            buildConfigField 'String', 'AUTH_SCHEME', '"com.plaxlabs.news.preview"'
            buildConfigField 'boolean', 'PLAY_STORE', playStoreOverride ?: 'false'
            buildConfigField 'String', 'ADS_BANNER_UNIT', '"' + liveAdBanner + '"'
            buildConfigField 'String', 'ADS_PAGE_UNIT', '"' + liveAdNative + '"'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.9.4'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.google.code.gson:gson:2.14.0'
    // Google ads: the banner and the full-page native ad, and the consent message that readers in the EEA, the UK and Switzerland see.
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    // The overflow menu is a popup window of its own, which only the system's accessibility tree can reach.
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}

// A unit test checks the update feed and APK published with the website (public/ at the repository root), so
// publishing a new build must run it again instead of Gradle reusing the earlier result. Another one runs the
// account code against a local Supabase stack when PLAX_LOCAL_STACK names its .env; it is skipped otherwise, and
// the setting is an input so that a run with the stack is never answered by an earlier run without it.
tasks.withType(Test).configureEach {
    inputs.files(fileTree(dir: file("$rootDir/../public"), includes: ['updates.json', 'plax-*.apk'])).withPropertyName('publishedUpdate')
    inputs.property('localAuthStack', providers.environmentVariable('PLAX_LOCAL_STACK').orElse(''))
    inputs.property('localSite', providers.environmentVariable('PLAX_LOCAL_SITE').orElse(''))
}

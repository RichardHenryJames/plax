plugins { id 'com.android.application' }

android {
    namespace 'com.plaxlabs.news'
    compileSdk 36
    defaultConfig {
        applicationId 'com.plaxlabs.news'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '1.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // The browser returns to the app on this scheme after Google sign-in; each build type has its own.
        manifestPlaceholders = [authScheme: 'com.plaxlabs.news']
        buildConfigField 'String', 'AUTH_SCHEME', '"com.plaxlabs.news"'
    }
    buildFeatures {
        buildConfig true
    }
    androidResources {
        localeFilters += ['en', 'hi']
    }
    buildTypes {
        debug {
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            manifestPlaceholders = [authScheme: 'com.plaxlabs.news.preview']
            buildConfigField 'String', 'AUTH_SCHEME', '"com.plaxlabs.news.preview"'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // The shipped preview: optimized like release (R8, not debuggable) but signed with the local
        // debug key, so it installs over earlier previews. It is not a store release.
        preview {
            initWith release
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            manifestPlaceholders = [authScheme: 'com.plaxlabs.news.preview']
            buildConfigField 'String', 'AUTH_SCHEME', '"com.plaxlabs.news.preview"'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.9.4'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.google.code.gson:gson:2.14.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
}

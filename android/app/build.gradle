plugins { id 'com.android.application' }

// Store builds never update themselves: Google Play does that, and the menu opens the listing instead. The release
// type is the store build; debug and preview are the ones distributed from the website, which look for updates
// there. -PplayStore=true or -PplayStore=false overrides this for one build.
def playStoreOverride = providers.gradleProperty('playStore').getOrNull()
if (playStoreOverride != null && !(playStoreOverride in ['true', 'false'])) throw new GradleException('playStore must be true or false.')

// The key that signs the bundle for Google Play (the upload key) is kept outside the repository, in a properties file
// on the machine that builds: PLAX_UPLOAD_PROPERTIES names it, otherwise ~/.plax-signing/upload.properties. Run
// new-upload-key.ps1 once to make both. Without the file the release type stays unsigned, so a build can never be
// signed with a key by accident, and package-aab.ps1 refuses to hand over an unsigned bundle.
def uploadPropertiesFile = file(providers.environmentVariable('PLAX_UPLOAD_PROPERTIES')
        .orElse("${System.getProperty('user.home')}/.plax-signing/upload.properties").get())
def uploadProperties = new Properties()
if (uploadPropertiesFile.isFile()) uploadPropertiesFile.withInputStream { uploadProperties.load(it) }

android {
    namespace 'com.plaxlabs.news'
    compileSdk 36
    defaultConfig {
        applicationId 'com.plaxlabs.news'
        minSdk 26
        targetSdk 36
        versionCode 12
        versionName '1.5.4'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // The browser returns to the app on this scheme after Google sign-in; each build type has its own.
        manifestPlaceholders = [authScheme: 'com.plaxlabs.news']
        buildConfigField 'String', 'AUTH_SCHEME', '"com.plaxlabs.news"'
    }
    buildFeatures {
        buildConfig true
    }
    androidResources {
        localeFilters += ['en', 'hi']
    }
    signingConfigs {
        if (uploadProperties.getProperty('storeFile')) {
            upload {
                storeFile file(uploadProperties.getProperty('storeFile'))
                storePassword uploadProperties.getProperty('storePassword')
                keyAlias uploadProperties.getProperty('keyAlias')
                keyPassword uploadProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            manifestPlaceholders = [authScheme: 'com.plaxlabs.news.preview']
            buildConfigField 'String', 'AUTH_SCHEME', '"com.plaxlabs.news.preview"'
            buildConfigField 'boolean', 'PLAY_STORE', playStoreOverride ?: 'false'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField 'boolean', 'PLAY_STORE', playStoreOverride ?: 'true'
            if (signingConfigs.findByName('upload')) signingConfig signingConfigs.upload
        }
        // The shipped preview: optimized like release (R8, not debuggable) but signed with the local
        // debug key, so it installs over earlier previews. It is not a store release.
        preview {
            initWith release
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            manifestPlaceholders = [authScheme: 'com.plaxlabs.news.preview']
            buildConfigField 'String', 'AUTH_SCHEME', '"com.plaxlabs.news.preview"'
            buildConfigField 'boolean', 'PLAY_STORE', playStoreOverride ?: 'false'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.9.4'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.google.code.gson:gson:2.14.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    // The overflow menu is a popup window of its own, which only the system's accessibility tree can reach.
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}

// A unit test checks the update feed and APK published with the website (public/ at the repository root), so
// publishing a new build must run it again instead of Gradle reusing the earlier result. Another one runs the
// account code against a local Supabase stack when PLAX_LOCAL_STACK names its .env; it is skipped otherwise, and
// the setting is an input so that a run with the stack is never answered by an earlier run without it.
tasks.withType(Test).configureEach {
    inputs.files(fileTree(dir: file("$rootDir/../public"), includes: ['updates.json', 'plax-*.apk'])).withPropertyName('publishedUpdate')
    inputs.property('localAuthStack', providers.environmentVariable('PLAX_LOCAL_STACK').orElse(''))
    inputs.property('localSite', providers.environmentVariable('PLAX_LOCAL_SITE').orElse(''))
}
